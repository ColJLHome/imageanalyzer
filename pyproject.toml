[project]
name = "imageanalyser"
version = "0.1.0"
description = "Search mounted image folders using a local llama-server vision model"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "Pillow>=11,<13"]

[project.optional-dependencies]
openclip = ["open_clip_torch>=3.2,<4", "torch>=2.6,<3", "torchvision>=0.21,<1"]
recognize = [
  "ram @ git+https://github.com/xinyu1205/recognize-anything.git@7cb804a8609e9f4b1a50b7f31436d2df40bb9481",
  "torch>=2.6,<3", "torchvision>=0.21,<1", "timm>=1.0.17,<2",
  "transformers>=4.46,<4.47", "fairscale>=0.4.13,<0.5", "scipy>=1.13,<2"
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "openclip" }, { index = "pytorch-cpu", extra = "recognize" }]
torchvision = [{ index = "pytorch-cpu", extra = "openclip" }, { index = "pytorch-cpu", extra = "recognize" }]

[project.scripts]
imageanalyser = "imageanalyser.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imageanalyser"]

[tool.hatch.metadata]
allow-direct-references = true
